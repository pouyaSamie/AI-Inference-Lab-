[project]
name = "lab-api"
version = "0.1.0"
description = "Persistent FastAPI controller, scheduling, persistence, auth and events"
requires-python = ">=3.12,<3.15"
dependencies = [
  "lab-core",
  "lab-bench",
  "lab-adapters",
  "lab-updates",
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.4,<3",
  "sqlalchemy>=2.0.30,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
lab-api = "lab_api.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lab_api"]
