[project]
name = "lab-core"
version = "0.1.0"
description = "Immutable schemas, identifiers, canonical hashing and scoring contracts"
requires-python = ">=3.12,<3.15"
dependencies = ["pydantic>=2.9,<3", "pydantic-settings>=2.4,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lab_core"]
