[project]
name = "lab-worker"
version = "0.1.0"
description = "Linux worker daemon foundation and simulated worker client"
requires-python = ">=3.12,<3.15"
dependencies = [
  "lab-core",
  "lab-adapters",
  "lab-bench",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "psutil>=6,<8",
]

[project.scripts]
lab-worker = "lab_worker.main:main"
lab-worker-sim = "lab_worker.simulate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lab_worker"]
