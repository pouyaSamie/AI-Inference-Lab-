[project]
name = "lab-updates"
version = "0.1.0"
description = "Deterministic release metadata, impact classification and A/B regression records"
requires-python = ">=3.12,<3.15"
dependencies = ["lab-core", "pydantic>=2.9,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lab_updates"]
