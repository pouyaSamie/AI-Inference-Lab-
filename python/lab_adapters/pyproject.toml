[project]
name = "lab-adapters"
version = "0.1.0"
description = "Pure, typed engine adapters (llama.cpp, Strata, future mock)"
requires-python = ">=3.12,<3.15"
dependencies = ["lab-core", "pydantic>=2.9,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lab_adapters"]
