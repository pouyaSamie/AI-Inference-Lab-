[project]
name = "lab-optimizer"
version = "0.1.0"
description = "Supervised Optuna process with durable optimizer command protocol"
requires-python = ">=3.12,<3.15"
dependencies = [
  "lab-core",
  "httpx>=0.27,<1",
  "optuna>=4.0,<5",
  "pydantic>=2.9,<3",
  "sqlalchemy>=2.0.30,<3",
]

[project.scripts]
lab-optimizer = "lab_optimizer.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lab_optimizer"]
